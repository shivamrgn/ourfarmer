<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#092f1b" />
      <stop offset="100%" stop-color="#051c10" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="20" y1="46" x2="48" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Golden Harvest Wheat Gradient -->
    <linearGradient id="goldGrad" x1="16" y1="44" x2="30" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- AI Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="1" />
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Badge Container -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Soil Arc Baseline -->
  <path d="M17 48.5 C24 51.5 40 51.5 47 48.5" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M21 52 C27 54 37 54 43 52" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Sprout Stem -->
  <path d="M32 48 C32 40 33 34 35 27" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Golden Leaf / Wheat Ear -->
  <path d="M32 38 C23 38 17 31 18 23 C24 23 30 28 32 35 Z" fill="url(#goldGrad)" />
  <path d="M19 25 C23 28 27 32 31 35" stroke="#92400e" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Main Right Emerald Leaf -->
  <path d="M33 37 C34 26 42 15 48 13 C49 22 43 32 33 37 Z" fill="url(#leafGrad)" />
  <!-- Center Vein -->
  <path d="M34 35 C38 28 43 21 47 14.5" stroke="#064e3b" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.65" />
  <!-- Side Vein Accent -->
  <path d="M39 26 C42 26 44 24 45 22.5" stroke="#064e3b" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- AI Intelligence Core Node (Subtle Tech Sparkle) -->
  <circle cx="33" cy="37" r="5" fill="url(#sparkGlow)" />
  <circle cx="33" cy="37" r="2" fill="#ecfdf5" />

  <!-- Upper Tech Glint -->
  <path d="M48 13 L49.5 9.5 L53 8 L49.5 6.5 L48 3 L46.5 6.5 L43 8 L46.5 9.5 Z" fill="#6ee7b7" />
  <circle cx="48" cy="8" r="1.2" fill="#ffffff" />
</svg>
